<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AURELIUM CRM</title>
  <link rel="icon" href="/assets/icon.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><img src="/assets/icon.png" alt="" /><span>AURELIUM</span><em>CRM</em></div>
    <nav id="tabs" class="tabs"></nav>
    <div class="top-actions">
      <input id="global-search" type="search" placeholder="Search leads…  (press /)" autocomplete="off" />
      <button class="btn primary" id="btn-new-lead">+ Lead</button>
    </div>
  </header>
  <main id="view" class="view"></main>
  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script>
    // If anything goes wrong loading the dashboard, say so on the page instead of staying blank.
    window.addEventListener('error', function (e) { var v = document.getElementById('view'); if (v && !v.children.length) v.innerHTML = '<div class="empty">The dashboard script failed: ' + (e.message || 'unknown error') + ' (' + (e.filename || '') + ':' + (e.lineno || '') + '). Send this line to Claude.</div>'; });
    setTimeout(function () { var v = document.getElementById('view'); if (v && !v.children.length && !window.__crmLoaded) v.innerHTML = '<div class="empty">The dashboard did not start. Check that AURELIUM is running, then reload. If this keeps happening, open the CRM from inside AURELIUM with the C key.</div>'; }, 5000);
  </script>
  <script src="/app.js"></script>
</body>
</html>
